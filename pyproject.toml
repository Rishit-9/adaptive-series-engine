[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "afae-engine"
version = "1.0.0"
description = "Adaptive Function Approximation Engine: A Hybrid Neuro-Symbolic Series Expansion API"
readme = "README.md"
requires-python = ">=3.10"
authors = [
{ name = "Rishit Gupta", email = "rishitkgupta@gmail.com" }
]
classifiers = [
"Programming Language :: Python :: 3",
"License :: OSI Approved :: MIT License",
"Operating System :: OS Independent",
"Topic :: Scientific/Engineering :: Mathematics",
"Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
"numpy>=1.24.0",
"sympy>=1.12",
"tensorflow-cpu>=2.13.0",
"matplotlib>=3.7.0",
"scipy>=1.10.0",
"fastapi>=0.103.0",
"uvicorn>=0.23.2",
"pydantic>=2.0.0"
]
[project.urls]
"Homepage" = "https://github.com/rishit-9/adaptive-series-engine"
"Bug Tracker" = "https://github.com/rishit-9/adaptive-series-engine/issues"